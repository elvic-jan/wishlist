<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GiftCircles</title>
    <meta name="description" content="Share wishlists with your family and friends." />
    <!--
      Release note: what this version brings, shown in the "New version
      available" notice. Every change that ships app code sets it (short,
      agreed before the PR; "Security fixes" is fine for security changes).
    -->
    <meta name="release-note" content="Updates now tell you what's new" />
    <!--
      Link previews (WhatsApp, iMessage, Signal, Slack…). The server makes the
      image and URL absolute and, for /join/<code>, fills in who invited whom
      (src/Wishlist.API/SpaPage.cs). Keep the attribute order: name/property, then content.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GiftCircles" />
    <meta property="og:title" content="GiftCircles" />
    <meta property="og:description" content="Share wishlists with your family and friends." />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/og/giftcircles.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GiftCircles" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GiftCircles" />
    <meta name="twitter:description" content="Share wishlists with your family and friends." />
    <meta name="twitter:image" content="/og/giftcircles.png" />
    <!-- Installable app: manifest for Android/desktop, Apple tags for iPhone/iPad. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Browser bar colour. The first-paint script below and ThemeProvider
         keep it in step with the app's own Light/Dark/System choice. -->
    <meta name="theme-color" content="#fafaf9" />
    <meta name="color-scheme" content="light dark" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="GiftCircles" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--
      First-paint theme + mode application.

      Runs synchronously before the React bundle so the initial paint
      already carries the correct `theme-<id>` and (optionally) `dark`
      classes on <html>. Avoids FOUC. Storage-key strings must stay in
      sync with `src/themes/registry.ts` — there is no module system
      available here.
    -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme') || 'terracotta';
          var mode = localStorage.getItem('mode') || 'system';
          var isDark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.add('theme-' + theme);
          if (isDark) root.classList.add('dark');
          // CSS isn't loaded yet, so use the default theme's background;
          // ThemeProvider replaces it with the real one after mount.
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', isDark ? '#0c0a09' : '#fafaf9');
        } catch (e) {
          // Storage unavailable (privacy mode etc.) — fall back to defaults.
          document.documentElement.classList.add('theme-terracotta');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
