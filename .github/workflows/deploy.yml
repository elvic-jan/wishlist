# Build on every push to main; deploy to production after a manual approval on
# the `production` environment. Rollback: re-run the deploy job of an older run
# (it carries that run's image tag and migrations bundle; its version is
# already tagged, so nothing is re-tagged).
#
# Versions: the build works out the version (scripts/release-version.mjs, from
# the last vX.Y.Z tag and the release-notes/ files added since) and the What's
# new list; after a successful deploy the commit is tagged vX.Y.Z, a GitHub
# Release is created and the image gets the tag X.Y.Z.
name: deploy

on:
  push:
    branches: [main]
    # OpenSpec docs (proposals, specs, archived changes) don't affect the app,
    # so a push that only touches them builds and deploys nothing. A push that
    # also changes other files still deploys. Run it by hand if ever needed.
    paths-ignore:
      - 'openspec/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.version.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version comes from the tags and the history since the last one.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Wishlist.Web/package-lock.json

      - name: Test API
        run: dotnet test Wishlist.sln --configuration Release

      - name: Lint SPA
        working-directory: src/Wishlist.Web
        run: |
          npm ci
          npm run lint

      - name: Image name
        id: meta
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${repo}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${repo}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version and release notes
        id: version
        run: |
          version=$(node scripts/release-version.mjs --json src/Wishlist.Web/public/releases.json --notes "$RUNNER_TEMP/notes.md")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          { echo "notes<<EOF_NOTES"; cat "$RUNNER_TEMP/notes.md"; echo "EOF_NOTES"; } >> "$GITHUB_OUTPUT"
          { echo "### Version $version"; cat "$RUNNER_TEMP/notes.md"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build migrations bundle
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.14
          dotnet ef migrations bundle \
            --project src/Wishlist.Infrastructure \
            --startup-project src/Wishlist.API \
            --self-contained -r linux-x64 \
            --output efbundle

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: efbundle
          path: efbundle
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      # Write: the version tag and GitHub Release, and the image's version tag.
      contents: write
      packages: write
      id-token: write
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      CONTAINER_APP: ca-wishlist
      RESERVATION_JOB: caj-wishlist-reservations
      IMAGE: ${{ needs.build.outputs.image }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # Before the download: checkout cleans the workspace.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: infra/sql

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: efbundle

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Allow CLI extensions to install on demand
        run: az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors

      - name: Look up Postgres server
        id: pg
        run: |
          name=$(az postgres flexible-server list -g "$RESOURCE_GROUP" --query "[0].name" -o tsv)
          fqdn=$(az postgres flexible-server show -g "$RESOURCE_GROUP" -n "$name" --query fullyQualifiedDomainName -o tsv)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "fqdn=$fqdn" >> "$GITHUB_OUTPUT"

      - name: Open database firewall for this runner
        run: |
          ip=$(curl -fsS https://api.ipify.org)
          az postgres flexible-server firewall-rule create -g "$RESOURCE_GROUP" -s "${{ steps.pg.outputs.name }}" \
            -n "gha-${GITHUB_RUN_ID}" --start-ip-address "$ip" --end-ip-address "$ip" --output none

      - name: Apply migrations
        env:
          PG_FQDN: ${{ steps.pg.outputs.fqdn }}
          PG_LOGIN: ${{ vars.POSTGRES_ADMIN_LOGIN || 'wishlistadmin' }}
          PG_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          chmod +x efbundle
          ./efbundle --connection "Host=${PG_FQDN};Port=5432;Database=wishlist;Username=${PG_LOGIN};Password=${PG_PASSWORD};SSL Mode=VerifyFull"

      # The app logs in as wishlist_app, which can only read and write rows
      # (infra/sql/app-role.sql). Created or updated here, after migrations, so
      # new tables are covered before the new image starts.
      - name: Set up the app's database login
        env:
          PGHOST: ${{ steps.pg.outputs.fqdn }}
          PGUSER: ${{ vars.POSTGRES_ADMIN_LOGIN || 'wishlistadmin' }}
          PGPASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          PGDATABASE: wishlist
          PGSSLMODE: verify-full
          PGSSLROOTCERT: system
          APP_PASSWORD: ${{ secrets.POSTGRES_APP_PASSWORD }}
        run: |
          if [ -z "$APP_PASSWORD" ]; then
            echo "::error::Secret POSTGRES_APP_PASSWORD is missing in the production environment (see infra/README.md)."
            exit 1
          fi
          psql -v ON_ERROR_STOP=1 -f infra/sql/app-role.sql
          # Through stdin so the password is a psql variable, not part of a command line.
          echo "ALTER ROLE wishlist_app PASSWORD :'app_password';" | psql -v ON_ERROR_STOP=1 -v app_password="$APP_PASSWORD"

      - name: Close database firewall
        if: always() && steps.pg.outputs.name != ''
        run: |
          az postgres flexible-server firewall-rule delete -g "$RESOURCE_GROUP" -s "${{ steps.pg.outputs.name }}" \
            -n "gha-${GITHUB_RUN_ID}" --yes --output none || true

      - name: Deploy image
        run: az containerapp update -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" --image "$IMAGE" --output none

      # The monthly job runs the same image, so it always matches the app and
      # the schema. It's created by the infra workflow; until then, skip.
      - name: Update reservation job image
        run: |
          if az containerapp job show -g "$RESOURCE_GROUP" -n "$RESERVATION_JOB" --output none 2>/dev/null; then
            az containerapp job update -g "$RESOURCE_GROUP" -n "$RESERVATION_JOB" --image "$IMAGE" --output none
          else
            echo "::notice::$RESERVATION_JOB doesn't exist yet; run the infra workflow to create it."
          fi

      # Healthy, and running this version (not the previous revision).
      - name: Smoke check
        run: |
          fqdn=$(az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" --query properties.configuration.ingress.fqdn -o tsv)
          for attempt in $(seq 1 20); do
            health=$(curl -fsS --max-time 30 "https://${fqdn}/healthz" || true)
            if printf '%s' "$health" | grep -q "\"version\":\"$VERSION\""; then
              echo "Deployed version $VERSION ($IMAGE) to https://${fqdn}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt: ${health:-no answer}"
            sleep 6
          done
          echo "::error::https://${fqdn}/healthz doesn't report version $VERSION."
          exit 1

      # Only for a version not tagged yet: re-running an older run's deploy job
      # (a rollback) finds its tag and changes nothing.
      - name: Tag the release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ needs.build.outputs.notes }}
        run: |
          tag="v$VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
            echo "::notice::$tag already exists; not tagging again."
            exit 0
          fi
          # Annotated, so the tag carries the release date (shown on What's new).
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$tag" -f message="Kadoozle $VERSION" \
            -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$object" --silent
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Kadoozle $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.tag.outputs.created == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the image with the version
        if: steps.tag.outputs.created == 'true'
        run: docker buildx imagetools create --tag "${IMAGE%:*}:$VERSION" "$IMAGE"
