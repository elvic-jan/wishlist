# Build on every push to main, deploy to staging, and once staging's smoke check
# passes, deploy to production after a manual approval on the `production`
# environment. The deploy steps themselves are in deploy-environment.yml.
#
# Branches: run this workflow by hand on a branch to try it on staging. It is
# built and deployed to staging only, with a pre-release version
# (X.Y.Z-pr.<sha7>); nothing is tagged and production is never touched. Deploys
# are started only by a push to main or by hand (both need write access), never
# by pull_request_target, comments or labels, which outsiders could trigger.
#
# Rollback: re-run the deploy-production job of an older run (it carries that
# run's image tag and migrations bundle; its version is already tagged, so
# nothing is re-tagged).
#
# Versions: the build works out the version (scripts/release-version.mjs, from
# the last vX.Y.Z tag and the release-notes/ files added since) and the What's
# new list; after a successful production deploy the commit is tagged vX.Y.Z, a
# GitHub Release is created and the image gets the tag X.Y.Z.
name: deploy

on:
  push:
    branches: [main]
    # OpenSpec docs (proposals, specs, archived changes) don't affect the app,
    # so a push that only touches them builds and deploys nothing. A push that
    # also changes other files still deploys. Run it by hand if ever needed.
    paths-ignore:
      - 'openspec/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.version.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version comes from the tags and the history since the last one.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Wishlist.Web/package-lock.json

      - name: Test API
        run: dotnet test Wishlist.sln --configuration Release

      - name: Lint SPA
        working-directory: src/Wishlist.Web
        run: |
          npm ci
          npm run lint

      # Only main moves :latest; a branch build is known by its sha- tag alone.
      - name: Image name
        id: meta
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${repo}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "latest=ghcr.io/${repo}:latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A branch build gets the version main would get, marked as a pre-release
      # of this commit, so it can't be mistaken for (or tagged as) a release.
      - name: Version and release notes
        id: version
        run: |
          # GITHUB_OUTPUT emptied: the script would write version= itself.
          version=$(GITHUB_OUTPUT= node scripts/release-version.mjs --json src/Wishlist.Web/public/releases.json --notes "$RUNNER_TEMP/notes.md")
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            version="${version}-pr.${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          { echo "notes<<EOF_NOTES"; cat "$RUNNER_TEMP/notes.md"; echo "EOF_NOTES"; } >> "$GITHUB_OUTPUT"
          { echo "### Version $version"; cat "$RUNNER_TEMP/notes.md"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The bundle, plus the IDs of the migrations it contains (EF names the
      # files after them), so a staging deploy can spot a database that is ahead.
      - name: Build migrations bundle
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.14
          dotnet ef migrations bundle \
            --project src/Wishlist.Infrastructure \
            --startup-project src/Wishlist.API \
            --self-contained -r linux-x64 \
            --output efbundle
          find src/Wishlist.Infrastructure/Migrations -maxdepth 1 -name '2*.cs' ! -name '*.Designer.cs' \
            -exec basename {} .cs \; | sort > migrations.txt
          cat migrations.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: efbundle
          path: |
            efbundle
            migrations.txt
          retention-days: 30

  # Automatic. Its own queue, so it never cancels a production deploy that is
  # waiting for approval.
  deploy-staging:
    needs: build
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      image: ${{ needs.build.outputs.image }}
      version: ${{ needs.build.outputs.version }}
      reset-on-unknown-migration: true

  # main only, after this build passed on staging, and after approval.
  deploy-production:
    needs: [build, deploy-staging]
    if: github.ref == 'refs/heads/main'
    permissions:
      # Write: the version tag and GitHub Release, and the image's version tag.
      contents: write
      packages: write
      id-token: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
      image: ${{ needs.build.outputs.image }}
      version: ${{ needs.build.outputs.version }}
      notes: ${{ needs.build.outputs.notes }}
      release: true
