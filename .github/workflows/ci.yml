# Checks every pull request before it's merged: API tests (with a throwaway
# Postgres, so the database tests run too), and lint plus a build of the web
# app. Uses no secrets and touches nothing in Azure.
name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # PRs that only touch openspec/ (archives, proposals) change nothing that
  # runs. The checks below are then skipped, and GitHub counts a skipped
  # required check as passed, so the PR can still be merged.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The PR's merge commit and its first parent (main).
          fetch-depth: 2

      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          other=$(git diff --name-only HEAD^1 HEAD -- . ':(exclude)openspec/**')
          if [ -n "$other" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Only openspec/ changed; skipping tests and build."
          fi

  api:
    name: API tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wishlist
          POSTGRES_PASSWORD: wishlist
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wishlist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The Postgres tests drop and recreate this database.
      GIFTCIRCLES_TEST_DB: Host=localhost;Port=5432;Database=giftcircles_e2e;Username=wishlist;Password=wishlist
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Wishlist.sln --configuration Release

  web:
    name: Web lint and build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/Wishlist.Web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Wishlist.Web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # A reminder, not a failure: Dependabot PRs change app code without a note,
  # and the deploy then shows the generic text on purpose.
  release-note:
    name: Release note
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The PR's merge commit and its first parent (main).
          fetch-depth: 2

      - name: Check the release note
        run: |
          page=src/Wishlist.Web/index.html
          note() { grep -o '<meta name="release-note" content="[^"]*"' || true; }
          app_changes=$(git diff --name-only HEAD^1 HEAD -- src/ ':(exclude)src/**/*.md' | head -n 20)
          if [ -z "$app_changes" ]; then
            echo "No app code changes; no new version to announce."
          elif [ "$(git show HEAD^1:$page | note)" = "$(note < $page)" ]; then
            echo "::warning title=Release note unchanged::This PR changes the app but not the release note in $page, so its release will show \"Refresh to get the latest GiftCircles.\" Set a note if this release deserves one."
          else
            echo "::notice title=Release note::$(note < $page | sed 's/.*content="//; s/"$//')"
          fi
