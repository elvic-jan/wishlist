# Checks every pull request before it's merged: API tests (with a throwaway
# Postgres, so the database tests run too), and lint plus a build of the web
# app. Uses no secrets and touches nothing in Azure.
name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # PRs that only touch openspec/ (archives, proposals) change nothing that
  # runs. The checks below are then skipped, and GitHub counts a skipped
  # required check as passed, so the PR can still be merged.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR's merge commit and its first parent (main).
          fetch-depth: 2

      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          other=$(git diff --name-only HEAD^1 HEAD -- . ':(exclude)openspec/**')
          if [ -n "$other" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Only openspec/ changed; skipping tests and build."
          fi

  api:
    name: API tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wishlist
          POSTGRES_PASSWORD: wishlist
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wishlist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The Postgres tests drop and recreate this database.
      GIFTCIRCLES_TEST_DB: Host=localhost;Port=5432;Database=giftcircles_e2e;Username=wishlist;Password=wishlist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Wishlist.sln --configuration Release

  web:
    name: Web lint and build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/Wishlist.Web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Wishlist.Web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # A reminder, not a failure: Dependabot PRs change app code without a note,
  # and their release is listed as "Small fixes and improvements". A malformed
  # note file fails the API tests (ReleaseNoteTests).
  release-note:
    name: Release note
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR's merge commit and its first parent (main).
          fetch-depth: 2

      - name: Check the release note
        run: |
          app_changes=$(git diff --name-only HEAD^1 HEAD -- src/ ':(exclude)src/**/*.md' | head -n 20)
          notes=$(git diff --name-only --diff-filter=A HEAD^1 HEAD -- 'release-notes/*.md' ':(exclude)release-notes/README.md')
          if [ -n "$notes" ]; then
            for f in $notes; do
              echo "::notice title=Release note ($(sed -n 's/^type:[[:space:]]*//p' "$f" | head -n 1))::$(sed '1,/^---$/d' "$f" | tr '\n' ' ')"
            done
          elif [ -z "$app_changes" ]; then
            echo "No app code changes; no release note needed."
          else
            echo "::warning title=No release note::This PR changes the app but adds no file in release-notes/, so its release will be listed as \"Small fixes and improvements\" (and count as a fix). Add one if this release deserves a note; see release-notes/README.md."
          fi
