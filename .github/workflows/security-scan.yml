# Monthly security scan: CodeQL (C#, TypeScript, the workflows themselves),
# known-vulnerable NuGet and npm packages, and a Trivy scan of the production
# image. Findings never fail the run; they're collected into one GitHub issue
# (label `security-scan`), which also asks whether to run a Claude security
# review this month. CodeQL and Trivy details also land in the Security tab.
# Free for a public repo; no secrets and nothing in Azure.
name: security-scan

on:
  schedule:
    # 06:00 UTC on the 1st of every month.
    - cron: '0 6 1 * *'
  workflow_dispatch:
  # TEMP: test run from the PR branch; removed before merge.
  push:
    branches: [ci/monthly-security-scan]

permissions:
  contents: read

concurrency:
  group: security-scan
  cancel-in-progress: false

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          # No build needed: CodeQL reads the source directly.
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  dependencies:
    name: Vulnerable packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: NuGet packages
        run: |
          dotnet restore Wishlist.sln
          dotnet list Wishlist.sln package --vulnerable --include-transitive --format json > nuget.json
          {
            echo "### NuGet packages (API)"
            rows=$(jq -r '
              [.projects[] | .path as $p | .frameworks[]? |
                ((.topLevelPackages // []) + (.transitivePackages // []))[] |
                .id as $id | .resolvedVersion as $v | .vulnerabilities[]? |
                "| \($id) | \($v) | \(.severity) | \(.advisoryurl) |"] | unique | .[]' nuget.json)
            if [ -z "$rows" ]; then
              echo "No known-vulnerable packages."
            else
              echo "| Package | Version | Severity | Advisory |"
              echo "|---|---|---|---|"
              echo "$rows"
            fi
            echo
          } > nuget.md
          cat nuget.md

      - name: npm packages
        working-directory: src/Wishlist.Web
        run: |
          # Exits non-zero when it finds something; the report is what we want.
          npm audit --json --package-lock-only > npm-audit.json || true
          {
            echo "### npm packages (web app)"
            total=$(jq '.metadata.vulnerabilities.total // 0' npm-audit.json)
            if [ "$total" = "0" ]; then
              echo "No known-vulnerable packages."
            else
              jq -r '.metadata.vulnerabilities | "Critical \(.critical), high \(.high), moderate \(.moderate), low \(.low)."' npm-audit.json
              echo
              echo "| Package | Severity | Direct | Fix available |"
              echo "|---|---|---|---|"
              jq -r '.vulnerabilities[] |
                "| \(.name) | \(.severity) | \(if .isDirect then "yes" else "no" end) | \(if .fixAvailable == false then "no" else "yes" end) |"' npm-audit.json
            fi
            echo
          } > "$GITHUB_WORKSPACE/npm.md"
          cat "$GITHUB_WORKSPACE/npm.md"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-dependencies
          path: |
            nuget.md
            npm.md

  image:
    name: Container image (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image that's live (deploy pushes :latest); build from source if it
      # can't be pulled.
      - name: Get the production image
        id: img
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker pull "$image"; then
            echo "source=the production image \`$image\`" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Couldn't pull $image; building the image from this commit instead."
            image="security-scan:local"
            docker build -t "$image" .
            echo "source=an image built from this commit" >> "$GITHUB_OUTPUT"
          fi
          echo "ref=$image" >> "$GITHUB_OUTPUT"

      - name: Scan (for the Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}
          version: v0.76.1
          scanners: vuln
          format: sarif
          output: trivy.sarif
          # Only what's worth an alert; the issue lists counts for the rest.
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Scan (for the issue)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}
          version: v0.76.1
          skip-setup-trivy: true
          scanners: vuln
          format: json
          output: trivy.json

      - name: Summarize
        env:
          SOURCE: ${{ steps.img.outputs.source }}
        run: |
          {
            echo "### Container image"
            echo "Scanned $SOURCE."
            echo
            jq -r '[.Results[]?.Vulnerabilities[]?] |
              "Critical \([.[] | select(.Severity=="CRITICAL")] | length), high \([.[] | select(.Severity=="HIGH")] | length), medium \([.[] | select(.Severity=="MEDIUM")] | length), low \([.[] | select(.Severity=="LOW")] | length)."' trivy.json
            rows=$(jq -r '[.Results[]? | .Target as $t | .Vulnerabilities[]? |
                select(.Severity=="CRITICAL" or .Severity=="HIGH") |
                "| \(.VulnerabilityID) | \(.Severity) | \(.PkgName) \(.InstalledVersion) | \(.FixedVersion // "not yet") | \($t) |"] |
                unique | .[0:40] | .[]' trivy.json)
            if [ -n "$rows" ]; then
              echo
              echo "Critical and high (first 40):"
              echo
              echo "| ID | Severity | Package | Fixed in | Where |"
              echo "|---|---|---|---|---|"
              echo "$rows"
            fi
            echo
          } > image.md
          cat image.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-image
          path: image.md

  report:
    name: Open the issue
    needs: [codeql, dependencies, image]
    # Still report what finished if one scan broke.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      security-events: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SECURITY_URL: ${{ github.server_url }}/${{ github.repository }}/security/code-scanning
      RESULTS: "CodeQL: ${{ needs.codeql.result }}, packages: ${{ needs.dependencies.result }}, image: ${{ needs.image.result }}"
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report-*
          merge-multiple: true

      - name: Write the issue
        run: |
          month=$(date -u +'%B %Y')
          title="Security scan: $month"
          if [ "$GITHUB_REF_NAME" != "main" ]; then title="$title (test run on $GITHUB_REF_NAME)"; fi

          # Open CodeQL alerts on the scanned branch (the image section covers Trivy).
          gh api --paginate "repos/$GH_REPO/code-scanning/alerts?state=open&tool_name=CodeQL&ref=$GITHUB_REF&per_page=100" > alerts.json || echo "[]" > alerts.json
          alerts=$(jq -s 'add // []' alerts.json)

          {
            echo "Monthly automated security scan of \`$GITHUB_REF_NAME\` ([run]($RUN_URL))."
            echo
            if [[ "$RESULTS" == *failure* || "$RESULTS" == *cancelled* ]]; then
              echo "> [!WARNING]"
              echo "> Not every scan finished ($RESULTS). Check the run."
              echo
            fi
            echo "### Code (CodeQL)"
            n=$(jq 'length' <<<"$alerts")
            if [ "$n" = "0" ]; then
              echo "No open alerts."
            else
              echo "$n open alerts — details in the [Security tab]($SECURITY_URL)."
              echo
              echo "| Severity | Rule | Where |"
              echo "|---|---|---|"
              jq -r '.[] | "| \(.rule.security_severity_level // .rule.severity) | [\(.rule.description)](\(.html_url)) | `\(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)` |"' <<<"$alerts" | head -n 40
            fi
            echo
            cat nuget.md npm.md image.md 2>/dev/null || true
            cat <<'EOF'
          ### Claude security review this month?

          The scans above find known patterns and published vulnerabilities. A Claude review also looks for logic problems, like one family seeing or changing another family's lists. It uses your Claude plan, so it's opt-in each month.

          To run it, start a Claude Code session on this repo (desktop app, or [claude.ai/code](https://claude.ai/code)) on `main` and give it this prompt:

          ```
          Do a security review of the Kadoozle codebase on main (ASP.NET Core API in src/Wishlist.API, Application, Domain, Infrastructure; React SPA in src/Wishlist.Web; Dockerfile; infra/; .github/workflows). Focus on: authentication, sessions and sign-in links; access control between users and circles (can anyone read or change another family's wishlists, reservations or invites?); the invite flow; input validation, injection and XSS; CORS, CSRF and security headers; rate limiting; secrets handling; and workflow permissions. Take into account the automated findings in this month's "Security scan" GitHub issue. Report findings ranked by severity with file:line, how it could be exploited, and a suggested fix. Don't change code; offer to fix the ones I pick.
          ```

          No review this month? Just close this issue.
          EOF
          } > body.md

          gh label create security-scan --color B60205 --description "Monthly automated security scan" 2>/dev/null || true
          # One open scan issue at a time: close last month's in favor of this one.
          old=$(gh issue list --label security-scan --state open --json number --jq '.[].number')
          url=$(gh issue create --title "$title" --label security-scan --body-file body.md)
          for n in $old; do gh issue close "$n" --comment "Superseded by $url."; done
          echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"
