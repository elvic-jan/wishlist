# Provision or update the Azure resources from infra/main.bicep. Run manually:
# first setup, secret rotation, custom-domain binding, or infra changes.
# Pick the environment: production (needs approval) or staging. Each has its
# own resource group, Azure identity, variables and secrets.
name: infra

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to provision
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: read
  id-token: write

# Shared with that environment's deploys, so infra and deploy never overlap.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      BASE_NAME: ${{ vars.BASE_NAME || 'wishlist' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Allow CLI extensions to install on demand
        run: az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors

      # Keep whatever image is running so re-provisioning never rolls the app back.
      - name: Current image
        id: current
        run: |
          image=$(az containerapp show -g "$RESOURCE_GROUP" -n "ca-${BASE_NAME}" \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          echo "image=${image:-mcr.microsoft.com/dotnet/samples:aspnetapp}" >> "$GITHUB_OUTPUT"

      - name: Deploy Bicep
        env:
          IMAGE: ${{ steps.current.outputs.image }}
          MIN_REPLICAS: ${{ vars.MIN_REPLICAS || '0' }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          CUSTOM_DOMAIN_CERT_READY: ${{ vars.CUSTOM_DOMAIN_CERT_READY || 'false' }}
          PREVIOUS_CUSTOM_DOMAIN: ${{ vars.PREVIOUS_CUSTOM_DOMAIN }}
          EMAIL_DOMAIN: ${{ vars.EMAIL_DOMAIN }}
          EMAIL_DOMAIN_VERIFIED: ${{ vars.EMAIL_DOMAIN_VERIFIED || 'false' }}
          # Email addresses are secrets: the repository is public, and a plain
          # variable's value is printed at the top of this step's log.
          BUDGET_CONTACT_EMAIL: ${{ secrets.BUDGET_CONTACT_EMAIL }}
          BUDGET_AMOUNT: ${{ vars.BUDGET_AMOUNT || '25' }}
          EXTERNAL_POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
          ENVIRONMENT_LABEL: ${{ vars.APP_ENVIRONMENT_LABEL }}
          EMAIL_ALLOWLIST: ${{ secrets.EMAIL_ALLOWLIST }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          POSTGRES_APP_PASSWORD: ${{ secrets.POSTGRES_APP_PASSWORD }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          # Test environments must name who may receive email; production must not.
          if [ "${{ inputs.environment }}" != production ] && [ -z "$ENVIRONMENT_LABEL" ]; then
            echo "::error::Variable APP_ENVIRONMENT_LABEL is missing in the ${{ inputs.environment }} environment (see infra/README.md)."
            exit 1
          fi
          if [ -z "$BUDGET_CONTACT_EMAIL" ]; then
            echo "::error::Secret BUDGET_CONTACT_EMAIL is missing in the ${{ inputs.environment }} environment (see infra/README.md)."
            exit 1
          fi
          if [ "${{ inputs.environment }}" = production ] && [ -n "$ENVIRONMENT_LABEL" ]; then
            echo "::error::Production must not have APP_ENVIRONMENT_LABEL."
            exit 1
          fi
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "wishlist-${GITHUB_RUN_ID}" \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
            --parameters \
              baseName="$BASE_NAME" \
              image="$IMAGE" \
              minReplicas="$MIN_REPLICAS" \
              customDomainName="$CUSTOM_DOMAIN" \
              customDomainCertificateReady="$CUSTOM_DOMAIN_CERT_READY" \
              previousCustomDomainName="$PREVIOUS_CUSTOM_DOMAIN" \
              emailCustomDomain="$EMAIL_DOMAIN" \
              emailCustomDomainVerified="$EMAIL_DOMAIN_VERIFIED" \
              budgetAmount="$BUDGET_AMOUNT" \
              budgetContactEmails="[\"$BUDGET_CONTACT_EMAIL\"]" \
              externalPostgresHost="$EXTERNAL_POSTGRES_HOST" \
              environmentLabel="$ENVIRONMENT_LABEL" \
              emailAllowList="$EMAIL_ALLOWLIST" \
              ghcrUsername="$GHCR_USERNAME" \
              postgresAdministratorPassword="$POSTGRES_ADMIN_PASSWORD" \
              postgresAppPassword="$POSTGRES_APP_PASSWORD" \
              jwtKey="$JWT_KEY" \
              smtpUser="$SMTP_USER" \
              smtpPassword="$SMTP_PASSWORD" \
              ghcrToken="$GHCR_PULL_TOKEN" \
            --query properties.outputs -o json > outputs.json

      - name: Summary
        run: |
          {
            echo "### Deployment outputs (${{ inputs.environment }})"
            echo '```json'
            cat outputs.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
